<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DevPilot Companion</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b1120;
      color: #e2e8f0;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title { font-weight: 650; font-size: 14px; }
    .pill {
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .pill.on { background: rgba(16, 185, 129, 0.18); color: #34d399; }
    .toolbar {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #1e293b;
      background: #0f172a;
      padding: 0 10px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: #94a3b8;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .tab-btn.active {
      color: #34d399;
      border-bottom-color: #34d399;
    }
    button {
      cursor: pointer;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font: 500 12px/1 inherit;
      padding: 7px 10px;
      border-radius: 6px;
    }
    button.primary { background: #0284c7; border-color: #38bdf8; }
    button:hover { opacity: 0.92; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .entry-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .ok { color: #34d399; }
    .error { color: #f87171; }
    .info { color: #38bdf8; }
    .time { color: #64748b; font-weight: 400; font-size: 11px; }
    .detail {
      margin-top: 4px;
      font-size: 12px;
      color: #cbd5e1;
      word-break: break-word;
    }
    .muted { color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="title">DevPilot Companion</div>
    <span id="sp-status" class="pill">OFFLINE</span>
  </header>

  <div class="toolbar">
    <button id="sp-pick" class="primary">Pick Element</button>
    <button id="sp-pause">Pause</button>
    <button id="sp-detach-all">Detach All</button>
  </div>

  <div class="tabs">
    <button id="tab-activity" class="tab-btn active">Activity</button>
    <button id="tab-errors" class="tab-btn">Errors (<span id="err-count">0</span>)</button>
    <button id="tab-network" class="tab-btn">Failed Net (<span id="net-count">0</span>)</button>
  </div>

  <main>
    <section>
      <h2>Active Controlled Tabs</h2>
      <div id="sp-tabs" class="muted">None</div>
    </section>

    <section>
      <h2 id="feed-heading">Live AI Activity Timeline</h2>
      <div id="sp-feed" class="muted">Waiting for agent commands…</div>
    </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
