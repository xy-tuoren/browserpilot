<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>DevPilot Companion</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --surface: #0f172a;
      --border: #1e293b;
      --border-strong: #334155;
      --text: #e2e8f0;
      --text-strong: #f8fafc;
      --detail: #cbd5e1;
      --muted: #64748b;
      --muted-strong: #94a3b8;
      --btn-bg: #1e293b;
      --pill-bg: #1e293b;
      --pill-text: #94a3b8;
      --pill-on-bg: rgba(16, 185, 129, 0.18);
      --pill-on-text: #34d399;
      --accent: #34d399;
      --ok: #34d399;
      --err: #f87171;
      --info: #38bdf8;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #1e293b;
      --text-strong: #0f172a;
      --detail: #334155;
      --muted: #64748b;
      --muted-strong: #475569;
      --btn-bg: #ffffff;
      --pill-bg: #e2e8f0;
      --pill-text: #475569;
      --pill-on-bg: #d1fae5;
      --pill-on-text: #047857;
      --accent: #059669;
      --ok: #059669;
      --err: #dc2626;
      --info: #0284c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: background 140ms ease, color 140ms ease;
    }
    header {
      padding: 12px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title { font-weight: 650; font-size: 14px; color: var(--text-strong); }
    .pill {
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--pill-text);
    }
    .pill.on { background: var(--pill-on-bg); color: var(--pill-on-text); }
    .toolbar {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 10px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--muted-strong);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--btn-bg);
      color: var(--text-strong);
      font: 500 12px/1 inherit;
      padding: 7px 10px;
      border-radius: 6px;
    }
    button.theme-btn {
      padding: 4px 8px;
      font-size: 11px;
    }
    button.primary { background: #0284c7; border-color: #0284c7; color: #fff; }
    button:hover { opacity: 0.9; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .entry-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .ok { color: var(--ok); }
    .error { color: var(--err); }
    .info { color: var(--info); }
    .time { color: var(--muted); font-weight: 400; font-size: 11px; }
    .detail {
      margin-top: 4px;
      font-size: 12px;
      color: var(--detail);
      word-break: break-word;
    }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="title">DevPilot Companion</div>
    <div class="header-right">
      <button id="sp-theme" class="theme-btn" title="Switch Dark / Light Mode">Light</button>
      <span id="sp-status" class="pill">OFFLINE</span>
    </div>
  </header>

  <div class="toolbar">
    <button id="sp-pick" class="primary">Pick Element</button>
    <button id="sp-pause">Pause</button>
    <button id="sp-detach-all">Detach All</button>
  </div>

  <div class="tabs">
    <button id="tab-activity" class="tab-btn active">Activity</button>
    <button id="tab-errors" class="tab-btn">Errors (<span id="err-count">0</span>)</button>
    <button id="tab-network" class="tab-btn">Failed Net (<span id="net-count">0</span>)</button>
  </div>

  <main>
    <section>
      <h2>Active Controlled Tabs</h2>
      <div id="sp-tabs" class="muted">None</div>
    </section>

    <section>
      <h2 id="feed-heading">Live AI Activity Timeline</h2>
      <div id="sp-feed" class="muted">Waiting for agent commands…</div>
    </section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
