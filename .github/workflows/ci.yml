name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install ffmpeg & Chrome for Testing (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          CHROME_OUT=$(npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/browserpilot-chrome")
          CHROME_BIN=$(echo "$CHROME_OUT" | tail -n 1 | sed 's/^[^ ]* //')
          test -x "$CHROME_BIN"
          echo "BROWSERPILOT_CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Using Chrome for Testing: $CHROME_BIN"
      - name: Install ffmpeg & Chrome for Testing (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          CHROME_OUT=$(npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/browserpilot-chrome")
          CHROME_BIN=$(echo "$CHROME_OUT" | tail -n 1 | sed 's/^[^ ]* //')
          test -x "$CHROME_BIN"
          echo "BROWSERPILOT_CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Using Chrome for Testing: $CHROME_BIN"
      - name: Install ffmpeg & Chrome for Testing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $chocoBin = "C:\ProgramData\chocolatey\bin"
          if (Test-Path $chocoBin) {
            "$chocoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$chocoBin;$env:Path"
          }
          ffmpeg -version | Select-Object -First 1
          $out = npx --yes @puppeteer/browsers install chrome@stable --path "$env:USERPROFILE\.cache\browserpilot-chrome"
          $lastLine = ($out | Select-Object -Last 1).ToString().Trim()
          $chromeBin = ($lastLine -replace '^[^\s]+\s+', '').Trim()
          if (-not (Test-Path $chromeBin)) { throw "Chrome binary not found at $chromeBin" }
          "BROWSERPILOT_CHROME_BIN=$chromeBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Chrome for Testing: $chromeBin"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Run unit & real Chromium + MV3 Extension E2E tests
        run: pnpm -r --workspace-concurrency=1 test
