name: Publish npm & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version
      - name: Install ffmpeg & Chrome for Testing
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          CHROME_OUT=$(npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/browserpilot-chrome")
          CHROME_BIN=$(echo "$CHROME_OUT" | awk '{print $2}' | tail -n 1)
          echo "BROWSERPILOT_CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, Typecheck & Test
        run: |
          pnpm build
          pnpm typecheck
          pnpm -r --workspace-concurrency=1 test
      - name: Publish browserpilot-cdp to npm (OIDC Trusted Publishing)
        working-directory: packages/server
        run: npm publish --provenance --access public
      - name: Package Extension ZIP & Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER=$(node -p "require('./packages/server/package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${PKG_VER}"
          fi
          ZIP="browserpilot-extension-${TAG}.zip"
          (cd packages/extension/dist && zip -rq "$GITHUB_WORKSPACE/$ZIP" .)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --generate-notes --title "BrowserPilot ${TAG}"
          fi
